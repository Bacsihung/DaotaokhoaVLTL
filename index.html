const NAV_HIST=[];
function pushNav(k,arg){
  const last=NAV_HIST[NAV_HIST.length-1];
  if(last&&last.k===k&&String(last.arg)===String(arg))return;
  NAV_HIST.push({k:k,arg:arg});
  if(NAV_HIST.length>40)NAV_HIST.shift();
}
function navigateTo(v,fromHist){
  if(!v||!v.k){home();return}
  if(v.k==='home')home();
  else if(v.k==='rules')rules();
  else if(v.k==='rooms')rooms();
  else if(v.k==='admin'&&typeof admin2==='function'&&ADM)admin2();
  else if(v.k&&v.k.startsWith('s')&&v.k.length<=3)subj(+v.k.slice(1));
  else if(v.k==='rev')rev(v.arg);
  else if(v.k==='ex1')ex1(v.arg,v.arg2);
  else home();
}
function goBack(){
  if(NAV_HIST.length>1){
    NAV_HIST.pop();
    const p=NAV_HIST[NAV_HIST.length-1];
    if(p)navigateTo(p,true);else home();
  }else home();
}
function back(){
  return `<div class="navrow"><button type="button" class="s" onclick="goBack()">← Quay lại</button><button type="button" class="s" onclick="home()">Trang chủ</button></div>`;
}
function uiCloseMask(m){try{m.remove()}catch(e){}}
function uiDialog({title,message,input,okText,cancelText}){
  return new Promise(resolve=>{
    const mask=document.createElement('div');
    mask.className='uimask';
    mask.innerHTML=`<div class="uibox" role="dialog" aria-modal="true">
      <h3>${esc(title||'Thông báo')}</h3>
      ${message?`<p>${esc(message)}</p>`:''}
      ${input?`<input class="uipass" id="uiIn" type="${input.type||'text'}" placeholder="${esc(input.placeholder||'')}" autocomplete="off" spellcheck="false">`:''}
      <div class="uiacts">
        ${cancelText!==false?`<button type="button" class="s" id="uiCancel">${esc(cancelText||'Hủy')}</button>`:''}
        <button type="button" id="uiOk">${esc(okText||'OK')}</button>
      </div>
    </div>`;
    document.body.appendChild(mask);
    const inp=mask.querySelector('#uiIn');
    const ok=mask.querySelector('#uiOk');
    const cancel=mask.querySelector('#uiCancel');
    const done=v=>{uiCloseMask(mask);resolve(v)};
    ok.onclick=()=>done(input?(inp.value||''):true);
    if(cancel)cancel.onclick=()=>done(input?null:false);
    mask.addEventListener('click',e=>{if(e.target===mask)done(input?null:false)});
    if(inp){inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')ok.click();if(e.key==='Escape')done(null)}}
    else ok.focus();
  });
}
function uiAlert(message,title){return uiDialog({title:title||'Thông báo',message:String(message),cancelText:false,okText:'Đóng'})}
function uiConfirm(message,title){return uiDialog({title:title||'Xác nhận',message:String(message),okText:'Đồng ý',cancelText:'Hủy'})}
function uiPromptPass(message,title){
  return uiDialog({title:title||'Đăng nhập quản trị',message:message||'Nhập mật khẩu quản trị',input:{type:'password',placeholder:'••••••••'},okText:'Đăng nhập',cancelText:'Hủy'});
}

function imp(el,k){const f=el.files[0];if(!f)return;f.arrayBuffer().then(b=>{const rows=XLSX.utils.sheet_to_json(XLSX.read(b).Sheets[XLSX.read(b).SheetNames[0]],{header:1,raw:false}).slice(1).filter(r=>r[0]);
if(k=="sv"){students=rows.map(r=>({n:r[0],d:r[1],from:r[2],to:r[3],room:r[4],t:r[5]}));SV("sv",students);if(OK&&ADM)api({action:'saveStudents'},{pin:ADM,students})}
else{Q=rows.map(r=>({q:r[0],o:[r[1],r[2],r[3],r[4]],a:"ABCD".indexOf(String(r[5]).trim().toUpperCase())}));SV("qs",Q)}alert("Đã nhập "+rows.length+" dòng")})}
function auto(){students.forEach((s,i)=>s.room=ROOMS[i%ROOMS.length]);SV("sv",students);alert("Đã phân phòng")}
async function exp(){const H=["STT","Họ tên","Ngày sinh","Đối tượng","Từ ngày","Đến ngày","Số câu đúng","Tổng số câu","Điểm","Thời điểm nộp"];
const ws=XLSX.utils.aoa_to_sheet([H,...results.map((r,i)=>[i+1,r.n,r.d,r.t,r.from,r.to,r.ok,r.tot,r.sc,r.at])]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"KetQuaThi");
const d=XLSX.write(wb,{type:"array",bookType:"xlsx"});try{const dl=await claude.use("downloads");if(!dl)return alert("Không hỗ trợ tải file ở môi trường này");await dl.save({filename:"ket_qua_thi_VLTL.xlsx",data:new Uint8Array(d)})}catch(e){}}
let PJ=null;const DOCS={};
function loadPJ(){return PJ||(PJ=new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";ok()};s.onerror=no;document.head.appendChild(s)}))}
function pdf(u){const [p,h]=u.split("#page=");let n=+h||1;const m=document.createElement("div");m.className="md";m.innerHTML=`<div style="width:100%;max-width:960px;height:100%;display:flex;flex-direction:column;padding:8px"><div style="margin-bottom:6px;color:#fff"><button id="px">✕ Đóng</button> <button class="s" id="pp">◀</button> <span id="pn"></span> <button class="s" id="pnx">▶</button> <button class="s" id="pd">Tải về</button></div><div id="pc" style="flex:1;overflow:auto;background:#fff;border-radius:8px;text-align:center;color:#333"><p>Đang tải…</p></div></div>`;document.body.appendChild(m);
const q=s=>m.querySelector(s);q("#px").onclick=()=>m.remove();let doc,buf;
const show=async()=>{if(!doc)return;n=Math.max(1,Math.min(doc.numPages,n));q("#pn").textContent=n+" / "+doc.numPages;const pg=await doc.getPage(n),box=q("#pc"),v0=pg.getViewport({scale:1}),sc=Math.min(2,(box.clientWidth-16)/v0.width),vp=pg.getViewport({scale:sc}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;c.style.maxWidth="100%";await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;box.replaceChildren(c);box.scrollTop=0};
q("#pp").onclick=()=>{n--;show()};q("#pnx").onclick=()=>{n++;show()};

(async()=>{try{await loadPJ();if(!DOCS[p])DOCS[p]=fetch(p).then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()});buf=await DOCS[p];doc=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;await show()}catch(e){q("#pc").innerHTML="<p>Không mở được file PDF ("+(e.message||e)+")</p>";delete DOCS[p]}})()}

const KEYS=[['parafin','tuthe','xedap','hongngoai','nhietlanh','lantro','namngoi','chudong','tudo','thangtuong','quayvai','xbvung','xbtoanthan','rongroc'],['parafin','nhietlanh','tuthe','xedap','hongngoai','lantro','namngoi','chudong','tudo','thangtuong','quayvai','xbvung'],['parafin','tuthe','xedap','hongngoai','nhietlanh','lantro','namngoi','chudong','cauthang','quayvai','xbvung','xbtoanthan','rongroc'],[]];
const NSET=[5,10,5,0],NQ=[40,60,40,0],LB=[['Thi kết thúc thực hành'],['PRETEST','POSTTEST'],['Thi kết thúc thực hành'],[]];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shf(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function opts(x,r){const o=shf([0,1,2,3],r);return{q:x[0],o:o.map(i=>x[1+i]),a:o.indexOf(0)}}
function build(i,set){const r=rng(97*i+31*set+5),ks=KEYS[i],n=NQ[i],base=Math.floor(n/ks.length);let pick=[],rest=[];
ks.forEach(k=>{const h=[5,6][Math.floor(r()*2)],o=[h].concat(shf([0,1,2,3,4,5,6].filter(j=>j!=h),r));o.slice(0,base).forEach(j=>pick.push([k,j]));o.slice(base).forEach(j=>rest.push([k,j]))});
pick=pick.concat(shf(rest,r).slice(0,n-pick.length));return shf(pick,r).map(p=>{const o=opts(QS[p[0]].q[p[1]],r);o.q='['+QS[p[0]].t+'] '+o.q;return o})}
function rev(i){A.innerHTML=back()+`<h2>Bộ câu hỏi ôn tập – ${SUBJ[i]}</h2><p class='mut'>Mỗi kỹ thuật có 5 câu ôn tập. Bấm Đáp án để xem.${i==1?' (Đang cập nhật: mới có '+KEYS[1].length+'/84 kỹ thuật.)':''}</p>`+KEYS[i].map((k,ti)=>`<div class='p'><h3>${ti+1}. ${QS[k].t}</h3>`+QS[k].q.slice(0,5).map((x,j)=>{const o=opts(x,rng(11*j+ti+3));return `<p><b>Câu ${j+1}.</b> ${o.q}<br>${o.o.map((t,m)=>'ABCD'[m]+'. '+t).join('<br>')}<br><details><summary class='mut'>Đáp án</summary><b>${'ABCD'[o.a]}</b></details></p>`}).join('')+`</div>`).join('')}
function subj(i){const s=SUBJ[i],ex=LB[i].map((l,li)=>{const o=open[s+'|'+l],ok=o&&o.on;return `<div class='c ${ok?'':'off'}' style='margin-bottom:8px' ${ok?`onclick=ex1(${i},${li})`:''}><h2>4. ${l}</h2><div class='mut'>${ok?'Đã mở – Đề số '+o.set+' – nhấn để vào thi':(CFG_ERR?'Lỗi kết nối máy chủ (bấm F5 để thử lại)':'Chờ Quản trị viên mở')}</div></div>`}).join('')||`<div class='c off'><h2>4. Thi kết thúc thực hành</h2><div class='mut'>Chưa có bộ đề cho nhóm này</div></div>`;
A.innerHTML=back()+`<h1>${s}</h1><div class='p'><h2>1. Danh mục kỹ thuật PHCN (TT 32/2023/TT-BYT)</h2>${TECH[i].length?TECH[i].map(t=>`<div>• ${link(t[0],t[1])}</div>`).join(''):'<span class=mut>Chưa có danh mục cho nhóm này.</span>'}</div><div class='p'><h2>2. Bảng kiểm quy trình kỹ thuật</h2>${CHECK.map((t,k)=>`<div>${k+1}. ${link(t[0],t[1])}</div>`).join('')}</div><div class='c ${KEYS[i].length?'':'off'}' style='margin-bottom:12px' ${KEYS[i].length?`onclick=rev(${i})`:''}><h2>3. Bộ câu hỏi trắc nghiệm ôn tập</h2><div class='mut'>${KEYS[i].length?KEYS[i].length+' kỹ thuật × 5 câu':'Đang cập nhật'}</div></div>`+ex}
function ex1(i,li){const l=LB[i][li],o=open[SUBJ[i]+'|'+l];S={si:i,l,t:SUBJ[i],set:o.set};A.innerHTML=back()+`<div class='p'><h2>Thi ${li||i==1?l+' ':''}– ${SUBJ[i]}</h2><p><input id=nm placeholder='Họ và tên'> <input id=db placeholder='Ngày sinh (dd/mm/yyyy)'></p><button onclick=ex2()>Tiếp tục</button></div>`}
function ex2(){const n=$('#nm').value,d=$('#db').value;if(!n||!d)return alert('Vui lòng nhập đủ thông tin');const f=students.find(s=>norm(s.n)==norm(n)&&norm(s.d)==norm(d))||{n,d,from:'',to:''};S.st=f;A.innerHTML=back()+`<div class='p'><h2>Thông tin học viên</h2><p>Họ tên: <b>${f.n}</b><br>Ngày sinh: <b>${f.d}</b><br>Thực hành tại khoa: <b>${f.from||'?'} – ${f.to||'?'}</b><br>Số câu: <b>${NQ[S.si]}</b> · Thời gian: <b>${NQ[S.si]*3/4} phút</b></p>${f.from?'':`<p class=mut>Không tìm thấy trong danh sách học viên.</p>`}<button onclick=start()>Xác nhận vào thi</button></div>`}
function start(){S.qs=build(S.si,S.set);S.ans={};S.i=0;S.dur=NQ[S.si]*45;S.left=S.dur;S.t0=Date.now();S.tm=setInterval(()=>{S.left=S.dur-Math.floor((Date.now()-S.t0)/1000);if(S.left<=0)return submit();const e=$('#tm');if(e)e.textContent=fmt(S.left)},1000);run()}
function submit(){clearInterval(S.tm);const tot=S.qs.length,ok=S.qs.filter((q,k)=>S.ans[k]===q.a).length,sc=+(ok/tot*10).toFixed(2);results.push({n:S.st.n,d:S.st.d,t:S.t,ph:S.l,set:S.set,from:S.st.from||'',to:S.st.to||'',ok,tot,sc,at:new Date().toLocaleString('vi-VN')});SV('res',results);A.innerHTML=`<div class='p' style='text-align:center'><h1>Kết quả</h1><p>Số câu đúng: <b>${ok}/${tot}</b></p><h2>Điểm: ${sc}/10</h2><button onclick=home()>Về trang chủ</button></div>`}
function setO(i,li,on,set){const id=SUBJ[i]+'|'+LB[i][li],o=open[id]||{on:false,set:1};if(on!==null)o.on=on;if(set!==null)o.set=set;open[id]=o;SV('open',open)}
function admin2(){const rows=[0,1,2].map(i=>LB[i].map((l,li)=>{const o=open[SUBJ[i]+'|'+l]||{on:false,set:1};return `<p><label><input type=checkbox ${o.on?'checked':''} onchange=setO(${i},${li},this.checked,null)> ${SUBJ[i]} – ${l}</label> Đề: <select onchange=setO(${i},${li},null,+this.value)>${Array.from({length:NSET[i]},(_,k)=>`<option ${o.set==k+1?'selected':''}>${k+1}</option>`).join('')}</select></p>`}).join('')).join('');
A.innerHTML=back()+`<div class='p'><h2>Quản trị</h2><h3>Mở thi và chọn đề</h3>${rows}<h3>Nhập danh sách học viên (Excel: Họ tên | Ngày sinh | Từ ngày | Đến ngày | Phòng | Đối tượng)</h3><input type=file accept='.xlsx,.xls' onchange=imp(this,'sv')><h3>Kết quả thi (${results.length})</h3><button onclick=exp()>Xuất Excel</button></div>`}
async function exp(){const H=['STT','Họ tên','Ngày sinh','Đối tượng','Giai đoạn','Bộ đề','Từ ngày','Đến ngày','Số câu đúng','Tổng số câu','Điểm','Thời điểm nộp'];const ws=XLSX.utils.aoa_to_sheet([H,...results.map((r,i)=>[i+1,r.n,r.d,r.t,r.ph,r.set,r.from,r.to,r.ok,r.tot,r.sc,r.at])]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'KetQuaThi');const d=XLSX.write(wb,{type:'array',bookType:'xlsx'});try{const dl=await claude.use('downloads');if(!dl)return alert('Không hỗ trợ tải file ở môi trường này');await dl.save({filename:'ket_qua_thi_VLTL.xlsx',data:new Uint8Array(d)})}catch(e){}}

ngoithangbang:{t:'Tập ngồi thăng bằng tĩnh và động',q:[

['Bài tập thăng bằng tĩnh được phát triển tăng tiến từ:','Vị thế vững nhất đến ít vững nhất','Vị thế ít vững nhất đến vững nhất','Đứng một chân đến nằm','Ngẫu nhiên'],
['Yếu tố cần được thiết lập đầu tiên trong mọi tư thế là:','Sự ổn định và kiểm soát đầu','Sự di động của cổ chân','Sức mạnh cơ tứ đầu đùi','Tầm vận động khớp vai'],
['Thời gian thực hiện kỹ thuật tập ngồi thăng bằng là:','10–20 phút','1–3 phút','40–50 phút','60 phút'],
['Ở tư thế ngồi thăng bằng tĩnh, khớp gối được gấp:','90°','45°','120°','Duỗi thẳng'],
['Khi tập ngồi thăng bằng động, người bệnh:','Với một hoặc hai tay lên trên, sang hai bên, ra trước hoặc cúi nhặt vật dưới sàn','Giữ nguyên tư thế, không cử động tay','Nằm nghiêng sang bên liệt','Đứng dậy bước đi'],
['Khi tập ngồi ở người nằm lâu, nếu người bệnh chóng mặt, mệt thì:','Ngừng tập, để người bệnh nằm nghỉ','Tăng thời gian tập','Cho đứng dậy để thích nghi','Tiếp tục tập thăng bằng động']]},
ngoidung:{t:'Tập thay đổi tư thế từ ngồi sang đứng',q:[
['Tư thế đứng chỉ thích hợp nếu duy trì được đúng vì trạng thái cân bằng:','Kém ổn định hơn các tư thế khác','Ổn định hơn nằm và ngồi','Không phụ thuộc chân đế','Không cần kiểm soát'],
['Chỉ định tập thay đổi tư thế từ ngồi sang đứng gồm:','Liệt nửa người do đột quỵ não, chấn thương sọ não, u não, viêm não','Hạ huyết áp tư thế đứng','Rối loạn tri giác không hiểu lệnh','Không điều khiển được cử động cơ thể'],
['Chống chỉ định tập từ ngồi sang đứng là:','Hạ huyết áp tư thế đứng','Liệt hai chân do tổn thương tủy sống','Parkinson','Sau thay khớp háng'],
['Cần thận trọng khi tập từ ngồi sang đứng ở người bệnh:','Rối loạn tri giác nhận thức, không hiểu lệnh','Bại não','Yếu cơ sau thở máy kéo dài','Đoạn chi lắp chân giả'],
['Thời gian thực hiện kỹ thuật tập từ ngồi sang đứng là:','15–20 phút','1–5 phút','40–50 phút','60–90 phút'],
['Khi tập từ ngồi sang đứng, hai bàn chân người bệnh đặt:','Sát sàn, ngang nhau, ở sau hai gối một chút','Ra xa phía trước hai gối','Chéo nhau, chân liệt ở trước','Co lên mép giường'],
['Người bệnh có thể ngã khi chuyển trọng lượng từ mông sang chân, đặc biệt ở:','Tai biến mạch não, chấn thương sọ não','Đau cơ do vận động','Viêm khớp nhẹ','Sau tập quá sức']]},
dungthangbang:{t:'Tập đứng thăng bằng tĩnh và động',q:[
['Khi tập thăng bằng đứng trên hai chân, hai bàn chân người bệnh cách nhau khoảng:','8–10 cm','30–40 cm','1 m','Sát nhau hoàn toàn'],
['Khi tập thăng bằng đứng, người điều trị đứng phía sau giữ người bệnh ở:','Khung chậu hay khớp vai','Hai cổ chân','Hai bàn tay','Vùng đầu'],
['Thời gian thực hiện kỹ thuật tập đứng thăng bằng là:','15–20 phút','1–3 phút','40–50 phút','60 phút'],
['Khi người bệnh đứng thăng bằng tốt, an toàn, có thể chuyển tiếp lên giai đoạn:','Tập dáng đi và tập đi trong thanh song song','Tập nằm đúng tư thế','Tập nằm sang ngồi','Tập lăn trở'],
['Té ngã có thể xảy ra khi:','Người bệnh di chuyển trọng lượng ra khỏi chân đế để tập thăng bằng đứng động','Nằm nghỉ sau tập','Hít thở sâu','Giữ tư thế ngồi'],
['Với người bệnh nằm lâu trước đó, trước khi tập cần kiểm tra:','Huyết áp, chỉ số mạch an toàn','Đường huyết','Thân nhiệt hai tay','Độ bão hòa oxy khi ngủ'],
['Khi tập thăng bằng đứng, người bệnh nhìn lên trần nhà, sang hai bên, ra sau và:','Chuyển trọng lượng từ chân này sang chân kia, giữ ổn định tư thế đứng','Ngồi xuống sàn','Bước đi vòng quanh phòng','Nhảy tại chỗ']]},
dangdi:{t:'Tập dáng đi',q:[
['Đi là hoạt động:','Điều hợp khéo léo và thăng bằng, liên quan nhiều khớp và cơ','Do một nhóm cơ duy nhất thực hiện','Luôn cần nỗ lực có ý thức','Không phụ thuộc cảm giác'],
['Thì chạm gót chiếm khoảng bao nhiêu phần trăm chu kỳ đi?','0–15%','15–30%','30–45%','45–60%'],
['Giai đoạn giữa thì chống chiếm khoảng:','15–30% chu kỳ đi','0–15%','30–45%','60–75%'],
['Thời gian thực hiện kỹ thuật tập dáng đi là:','20–30 phút','1–5 phút','40–50 phút','60–90 phút'],
['Bài tập duy trì hay gia tăng lực cơ trên giường nên có:','Đề kháng bằng lò xo hay tạ khi có thể và không chống chỉ định','Kháng trở tối đa ngay từ đầu','Không có đề kháng','Thực hiện sau khi xuất viện'],
['Cử động thay thế thường gặp khi tập dáng đi là:','Nâng chậu thay gập hông, quét vòng chân thay gập gối ở thì đu đưa','Duỗi gối hết tầm khi tập','Giữ thân thẳng','Bước đều hai chân'],
['Người bệnh nằm lâu, trước khi tập đi cần:','Có thời gian thích nghi với tư thế thẳng đứng','Đứng dậy ngay không chuẩn bị','Nằm yên 24 giờ','Tập chạy']]},
khungtapdi:{t:'Tập đi với khung tập đi',q:[
['Khung tập đi là:','Dụng cụ trợ giúp di chuyển cho người gặp khó khăn trong đi lại','Máy kéo giãn cột sống','Dụng cụ tập khớp vai','Thiết bị tập thở'],
['Chỉ định dùng khung tập đi gồm:','Liệt nửa người, liệt hai chi dưới, tập sử dụng chân giả, bại não','Rối loạn tri giác không hiểu lệnh','Không điều khiển được cử động cơ thể','Người bệnh hôn mê'],
['Chống chỉ định tập với khung tập đi là:','Rối loạn tri giác nhận thức, không hiểu lệnh','Người già yếu','Rối loạn thăng bằng','Trẻ bại não'],
['Thời gian thực hiện tập với khung tập đi là:','20–30 phút','1–5 phút','40–50 phút','60–90 phút'],
['Khi tập, người bệnh đứng thẳng:','Hai tay nắm phần trên khung, hai chân đứng phần giữa khung, hơi nghiêng về trước','Hai tay buông, hai chân ngoài khung','Một tay nắm khung, một tay giữ gậy','Tay nắm phía dưới khung, ngả ra sau'],
['Thứ tự đúng khi đi với khung là:','Di chuyển khung lên trước → một chân lên trước → chân còn lại','Một chân lên trước → khung → chân còn lại','Cả hai chân → khung','Khung → chân sau → chân trước'],
['Để phòng tai biến khi tập với khung, cần:','Kiểm tra kỹ dụng cụ trước khi tập, có người đi cạnh trợ giúp','Để người bệnh tự tập','Không cần kiểm tra dụng cụ','Tập tăng tốc độ']]},
nang:{t:'Tập đi với nạng (nạng nách, nạng khuỷu)',q:[
['Hai loại nạng chính là:','Nạng nách và nạng khuỷu','Nạng đơn và nạng đôi','Nạng gỗ và nạng sắt','Nạng ngắn và nạng dài'],
['Chống chỉ định tập đi với nạng là:','Bệnh lý cả hai chi trên không có khả năng chịu lực','Liệt hai chi dưới','Sau thay khớp','Trẻ bại não'],
['Cần thận trọng khi tập đi với nạng ở người bệnh:','Rối loạn tri giác nhận thức, không hiểu lệnh','Tập sử dụng chân giả','Bại liệt','Sau kết hợp xương chi dưới'],
['Thời gian thực hiện tập đi với nạng là:','20–30 phút','1–5 phút','40–50 phút','60–90 phút'],
['Cách đi ba điểm có thứ tự di chuyển là:','Hai nạng → chân bệnh → chân bình thường','Chân bình thường → hai nạng → chân bệnh','Chân bệnh → chân bình thường → hai nạng','Nạng phải → chân trái → nạng trái → chân phải'],
['Cách đi bốn điểm luân phiên tạo ra:','Ít nhất 3 điểm trợ giúp ở cùng một thời điểm','Hai điểm trợ giúp','Một điểm trợ giúp','Không có điểm trợ giúp'],
['Cách đi hai điểm luân phiên so với bốn điểm:','Nhanh hơn, yêu cầu thăng bằng tốt hơn','Chậm hơn, yêu cầu thăng bằng kém hơn','Nhanh hơn, dành cho người không dồn trọng lượng lên chân','Chậm hơn, dùng một nạng']]},
diahinh:{t:'Tập đi trên các địa hình khác nhau',q:[
['Tập di chuyển trên các địa hình giúp người bệnh:','Tái hội nhập xã hội khi ra viện','Giảm tầm vận động khớp','Tăng co cứng','Nằm tại giường lâu hơn'],
['Chỉ định tập di chuyển trên các địa hình gồm:','Liệt nửa người, tổn thương tủy sống không hoàn toàn','Thể trạng quá yếu, đứng chưa vững','Rối loạn tri giác nặng','Hôn mê'],
['Chống chỉ định tập di chuyển trên địa hình là:','Thể trạng quá yếu, đứng chưa vững','Yếu hai chân','Đau thần kinh tọa','Sau gãy xương chi dưới'],
['Cần thận trọng khi tập di chuyển trên địa hình ở người bệnh:','Có nguy cơ té ngã','Đau thần kinh tọa','Yếu hai chân','Liệt nửa người ổn định'],
['Thời gian thực hiện kỹ thuật tập di chuyển trên địa hình là:','20–30 phút','1–5 phút','40–50 phút','60–90 phút'],
['Khi lên dốc, người bệnh liệt nửa người bước:','Chân lành lên trước, sau đó chân liệt','Chân liệt lên trước, sau đó chân lành','Hai chân cùng lúc','Chân liệt hai bước'],
['Khi xuống dốc, kỹ thuật viên đứng:','Phía trước người bệnh','Phía sau người bệnh','Trên đỉnh dốc','Cách xa 3 m']]},
thudong:{t:'Tập vận động thụ động',q:[
['Vận động thụ động là vận động:','Không có sự co cơ chủ động của người bệnh','Do người bệnh tự thực hiện hoàn toàn','Chống lại lực cản','Có hỗ trợ của người bệnh'],
['Chỉ định vận động thụ động là:','Người bệnh không tự làm được động tác vận động','Người bệnh tự thực hiện được đầy đủ','Cơ lực bậc 5','Gãy xương chưa xử trí'],
['Chống chỉ định vận động thụ động là:','Gãy xương, can xương độ I hoặc II','Người bệnh liệt không vận động','Co cứng khớp','Yếu cơ'],
['Thời gian thực hiện tập thụ động và tần suất là:','15–30 phút, 1–2 lần/ngày','5 phút, 10 lần/ngày','45–60 phút, 1 lần/tuần','2 giờ, 1 lần/ngày'],
['Khi tập thụ động, người làm kỹ thuật không được:','Dùng lực bắt khớp cần tập vận động','Cho người bệnh tư thế thoải mái','Tập theo tầm vận động bình thường','Vận động theo mẫu'],
['Khi đau trong lúc tập thụ động:','Không tập vận động vượt quá tầm vận động bình thường của khớp','Tăng lực để vượt đau','Tăng tầm vận động','Tiếp tục không thay đổi'],
['Hạ huyết áp, ngừng tim, ngừng thở, gãy xương, trật khớp khi tập thụ động:','Ngừng tập và xử trí cấp cứu ngay','Giảm tốc độ tập','Chuyển tư thế rồi tiếp tục','Theo dõi thêm 1 giờ']]},
keodan:{t:'Tập kéo dãn',q:[
['Kéo dãn là kỹ thuật dùng để:','Kéo dài cấu trúc mô mềm bị co ngắn, gia tăng tầm vận động khớp','Làm ngắn mô mềm','Giảm tầm vận động','Cố định khớp'],
['Hai phương pháp kéo dãn chính là:','Kéo dãn thụ động và tự kéo dãn','Kéo dãn chủ động và kháng trở','Kéo dãn nhiệt và lạnh','Kéo dãn điện và từ'],
['Kéo dãn thụ động bằng tay là phương pháp có:','Thời gian ngắn, kết quả tầm vận động nhất thời','Kết quả vĩnh viễn','Không cần người điều trị','Dùng lực cơ của người bệnh'],
['Thời gian thực hiện kỹ thuật kéo dãn là:','10–20 phút','1–3 phút','40–50 phút','60 phút'],
['Khi kéo dãn cơ trên nhiều khớp, kéo dãn:','Khớp gần trước, tiếp đến khớp xa','Khớp xa trước, tiếp đến khớp gần','Đồng thời tất cả khớp ngay từ đầu','Khớp ở giữa trước'],
['Đau khớp hoặc nhức cơ kéo dài hơn 24 giờ sau kéo dãn ngày đầu là dấu hiệu:','Lực kéo dãn quá mức','Kéo dãn đạt hiệu quả tối đa','Cần tăng lực','Bình thường'],
['Ngày thứ hai, nếu đau tăng và kéo dài quá 6 giờ:','Kéo dãn đã quá liều, cần giảm cường độ và thời gian','Tăng lực kéo','Giữ nguyên','Ngừng điều trị vĩnh viễn']]},
bong:{t:'Tập vận động trên bóng',q:[
['Tập vận động trên bóng đặc biệt hiệu quả cho:','Trẻ bại não','Người cao tuổi suy tim','Phụ nữ có thai','Người đoạn chi'],
['Chỉ định tập trên bóng gồm:','Trẻ bại não, chậm phát triển tinh thần, vận động','Trẻ sợ, khóc nhiều sau khi tập','Trẻ sốt cao','Trẻ gãy xương hở'],
['Chống chỉ định tập vận động trên bóng là:','Trẻ sợ, khóc nhiều sau khi tập','Trẻ chưa kiểm soát đầu cổ','Trẻ bại não','Trẻ chậm phát triển vận động'],
['Thời gian thực hiện kỹ thuật tập trên bóng là:','15–20 phút','1–3 phút','45–60 phút','90 phút'],
['Mỗi lần tập trên bóng 15–20 phút và:','Ngày tập 2–3 lần','Tuần tập 1 lần','Ngày tập 10 lần','Tháng tập 1 lần'],
['Khi tập kiểm soát đầu cổ ở tư thế nằm sấp, trẻ được:','Đặt nằm sấp trên bóng, kỹ thuật viên cố định khớp gối hoặc hông','Đặt ngồi trên ghế','Đặt đứng bám tường','Đặt nằm ngửa trên sàn'],
['Trẻ có thể ngã khi tập đứng, đi nếu:','Đu đưa, đẩy bóng quá nhanh','Bóng quá cứng','Trẻ nằm yên','Tập ngày 2 lần']]}
});

function back(){return `<div class='navrow'><button type='button' class='s' onclick='goBack()'>← Quay lại</button><button type='button' class='s' onclick='home()'>Trang chủ</button></div>`}
const tnm=t=>t[0].replace(/^\d+\.\s*/,''),tnu=t=>(t[0].match(/^\d+/)||[''])[0];
function trow(t){const u=t[1];return `<div class='tr' data-t='${tnm(t).toLowerCase()}' ${u?`onclick="pdf('${u}','${tnm(t).replace(/'/g,'')}')"`:''}><span class='nb'>${tnu(t)}</span><span class='tn'>${tnm(t)}</span><span class='pill ${u?'':'x'}'>${u?'PDF':'Chưa có file'}</span></div>`}
function flt(v){v=v.toLowerCase();document.querySelectorAll('.tr[data-t]').forEach(r=>r.style.display=r.dataset.t.includes(v)?'':'none')}
let SUBJ_PANEL=null; // tech | bk | rev | null

function setPairs(i,set){const r=rng(97*i+31*set+5),ks=KEYS[i],n=NQ[i],base=Math.floor(n/ks.length);let pick=[],rest=[];ks.forEach(k=>{const h=[5,6][Math.floor(r()*2)],o=[h].concat(shf([0,1,2,3,4,5,6].filter(j=>j!=h),r));o.slice(0,base).forEach(j=>pick.push([k,j]));o.slice(base).forEach(j=>rest.push([k,j]))});return pick.concat(shf(rest,r).slice(0,n-pick.length))}
function mkExam(i,set){const r=Math.random;return shf(setPairs(i,set),r).map(p=>{const o=opts(QS[p[0]].q[p[1]],r);o.q='['+QS[p[0]].t+'] '+o.q;return o})}

function findAny(kw){return FILES.filter(f=>nz(f.path.join(' ')+' '+f.name).includes(kw))}
function bkFile(si,k){const re=new RegExp('(^| )0*'+k+'( |$)');const L=subjFiles(si,'bang kiem',false);const m=L.find(f=>re.test(nz(f.name)));if(m)return m;return findAny('bang kiem').find(f=>re.test(nz(f.name)))}

function maskText(text,ents){const orig=text.normalize('NFC'),f=fold(orig).toLowerCase(),g={};ents.forEach((e,k)=>{const n=fold(stripRole(e)).toLowerCase().trim();if(n.length>=3)(g[n]=g[n]||[]).push('H'+(k+1))});
 const hits=[];Object.keys(g).sort((a,b)=>b.length-a.length).forEach(n=>{const re=new RegExp('(^|[^a-z0-9])('+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')+')(?![a-z0-9])','g');let m;while((m=re.exec(f))){const a=m.index+m[1].length,b=a+m[2].length;if(!hits.some(h=>a<h.b&&b>h.a))hits.push({a,b,t:'học viên '+g[n].join(' và ')})}});
 hits.sort((x,y)=>y.a-x.a);let out=orig;hits.forEach(h=>{out=out.slice(0,h.a)+h.t+out.slice(h.b)});return out}

const WHEEL_N={0:3,1:8,2:3};
const WHEEL_COLORS=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#34495e','#e91e63','#00bcd4','#8bc34a','#ff5722','#673ab7','#009688','#ff9800','#607d8b'];

function wheelBkList(si){
  // Chỉ lấy từ Bảng kiểm quy trình kỹ thuật trên Drive (không lấy danh mục kỹ thuật)
  const L=[],seen={};
  const add=(num,name,id)=>{
    const key=(id||'')+'|'+(num||'')+'|'+name;
    if(seen[key])return;seen[key]=1;
    L.push({k:String(num||name),name:String(name),id:id||null,num:num?String(num):''});
  };
  // Ưu tiên file trong thư mục đối tượng có chữ "bang kiem"
  if(typeof subjFiles==='function'){
    subjFiles(si,'bang kiem',false).forEach(f=>{
      const name=f.name.replace(/\.pdf$/i,'').replace(/\.docx?$/i,'');
      const m=name.match(/(?:^|\s|_|-)(\d{1,3})(?:\s|\.|_|-|$)/) || name.match(/(\d{1,3})/);
      add(m?m[1]:'', name, f.id);
    });
  }
  // Bổ sung qua bkFile theo số thứ tự (1..60) nếu có
  if(typeof bkFile==='function'){
    for(let n=1;n<=60;n++){
      const f=bkFile(si,n);
      if(f){
        const name=f.name.replace(/\.pdf$/i,'').replace(/\.docx?$/i,'');
        add(String(n), name, f.id);
      }
    }
  }
  // Sắp theo số nếu có
  L.sort((a,b)=>{
    const na=parseInt(a.num,10), nb=parseInt(b.num,10);
    if(!isNaN(na)&&!isNaN(nb))return na-nb;
    if(!isNaN(na))return -1;
    if(!isNaN(nb))return 1;
    return a.name.localeCompare(b.name,'vi');
  });
  return L;
}

function drawWheel(angle){
  const canvas=document.getElementById('wcanvas');if(!canvas)return;
  const ctx=canvas.getContext('2d'),cx=170,cy=170,R=160;
  const L=window._wLabels||[],n=L.length||1;
  ctx.clearRect(0,0,340,340);
  const slice=2*Math.PI/n;
  for(let i=0;i<n;i++){
    const a0=angle+i*slice-Math.PI/2,a1=a0+slice;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a0,a1);ctx.closePath();
    ctx.fillStyle=L[i].color;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a0+slice/2);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 11px system-ui,sans-serif';
    const label=(L[i].num?L[i].num+'. ':'')+L[i].name;
    ctx.fillText(label.length>22?label.slice(0,20)+'…':label,R-12,4);ctx.restore();
  }
  ctx.beginPath();ctx.arc(cx,cy,28,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#2b5797';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#2b5797';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText('QTKT',cx,cy+4);
}
function runWheelSpin(si,need){
  if(window._wSpinning)return;
  const n=(document.getElementById('wn').value||'').trim();
  const d=(document.getElementById('wd').value||'').trim();
  if(!n)return alert('Vui lòng nhập họ tên học viên');
  const L=window._wLabels||[];
  if(L.length<need)return alert('Không đủ bảng kiểm');
  window._wSpinning=true;
  const btn=document.getElementById('wspin');if(btn)btn.disabled=true;
  const pool=L.slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const picked=pool.slice(0,need);
  const turns=5+Math.random()*3;
  const targetIdx=Math.max(0,L.indexOf(picked[0]));
  const slice=2*Math.PI/L.length;
  const targetAngle=turns*2*Math.PI-(targetIdx*slice+slice/2);
  const start=performance.now(),dur=4200,startAng=window._wAngle||0;
  const ease=t=>1-Math.pow(1-t,3);
  (function frame(now){
    const t=Math.min(1,(now-start)/dur);
    const ang=startAng+(targetAngle-startAng)*ease(t);
    window._wAngle=ang;drawWheel(ang);
    if(t<1)requestAnimationFrame(frame);
    else{window._wSpinning=false;if(btn)btn.disabled=false;finishWheel(si,n,d,picked)}
  })(start);
}

      ${p.id?`<div style='margin:4px 0 8px;display:flex;gap:8px;flex-wrap:wrap'>
        <a class='pill' style='cursor:pointer;text-decoration:none' href='#' onclick="openF('${p.id}','${esc(p.name).replace(/'/g,'')}');return false">👁 Xem trên Drive</a>
        <a class='pill' style='cursor:pointer;text-decoration:none' href='https://drive.google.com/uc?export=download&id=${p.id}' target='_blank'>⬇ Tải về</a>
      </div>`:'<div class="mut">Chưa gắn file Drive</div>'}</li>`).join('')}
    </ol></div>`;
  }
  toast('Đã lưu kết quả quay');
}
function lookupWheel(si){
  const n=(document.getElementById('wln').value||'').trim();
  const d=(document.getElementById('wld').value||'').trim();
  const out=document.getElementById('wlout');
  if(!n){out.innerHTML='<p class=mut>Nhập họ tên.</p>';return}
  const rec=findWheelForStudent(si,n,d);
  if(!rec){out.innerHTML='<p class=mut>Chưa có kết quả quay cho học viên này.</p>';return}
  const items=rec.items||[];
  out.innerHTML=`<div class='al'>Kết quả lúc ${esc(rec.at||'')}</div>
  <ol style='line-height:1.9'>${items.map(it=>{
    const num=typeof it==='object'?(it.num||''):'';
    const name=typeof it==='object'?it.name:it;
    const id=typeof it==='object'?it.id:null;
    return `<li><b>${num?num+'. ':''}${esc(name)}</b>
      ${id?`<div style='display:flex;gap:8px;margin:4px 0 8px;flex-wrap:wrap'>
        <a class='pill' style='cursor:pointer;text-decoration:none' href='#' onclick="openF('${id}','${esc(name).replace(/'/g,'')}');return false">👁 Xem</a>
        <a class='pill' style='cursor:pointer;text-decoration:none' href='https://drive.google.com/uc?export=download&id=${id}' target='_blank'>⬇ Tải</a>
      </div>`:''}</li>`;
  }).join('')}</ol>`;
}
function wheelResultHTML(si){
  return `<div class='p'><div class='ch2'>Bảng kiểm QTKT đã quay</div>
    <p class='mut'>Nhập họ tên để xem các bảng kiểm đã quay (số, tên, link Drive).</p>
    <div style='display:flex;gap:8px;flex-wrap:wrap;align-items:end'>
      <div style='flex:1;min-width:140px'><label class='lbl'>Họ tên</label><input class='fi' id='wln' placeholder='Họ tên'></div>
      <div style='flex:1;min-width:120px'><label class='lbl'>Ngày sinh</label><input class='fi' id='wld' placeholder='dd/mm/yyyy'></div>
      <button class='s' onclick='lookupWheel(${si})'>Xem</button>
    </div>
    <div id='wlout' style='margin-top:10px'></div>
  </div>`;
}
function wheelHTML(si){
  const lookup=wheelResultHTML(si);
  if(!wheelEnabled(si)) return lookup;
  const n=WHEEL_N[si]||3;
  return `<div class='p' style='border:2px solid var(--pr);background:linear-gradient(180deg,#f0f6ff,#fff);box-shadow:0 4px 16px rgba(43,87,151,.12)'>
    <div class='ch2'>Vòng quay bảng kiểm QTKT</div>
    <p class='mut'>Quay ngẫu nhiên <b>${n}</b> bảng kiểm. Kết quả có số thứ tự, tên và link Drive.</p>
    <button onclick=spinWheel(${si}) style='width:100%;font-size:16px;padding:12px'>🎲 Mở vòng quay – chọn ${n} bảng kiểm</button>
  </div>`+lookup;
}


// ===== Xuất kết quả cuối đợt theo mẫu 3 đối tượng =====
function normName(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function scoreForStudent(name, obj){
  // Lấy điểm lý thuyết mới nhất từ results (bỏ QTKT vòng quay)
  const nn=normName(name);
  const list=(results||[]).filter(r=>normName(r.n)===nn && (!obj||r.t===obj) && r.type!=='wheel' && r.sc!=null && r.sc!=='—');
  if(!list.length)return '';
  list.sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
  return list[0].sc;
}
function periodText(from,to){
  if(from&&to)return 'Từ ngày '+from+' đến ngày '+to;
  if(from)return 'Từ ngày '+from;
  if(to)return 'Đến ngày '+to;
  return '';
}
function currentMonthLabel(){
  const d=new Date();
  return 'THÁNG '+(d.getMonth()+1)+'/'+d.getFullYear();
}
function studentsByObj(obj){
  // Ưu tiên danh sách học viên; nếu không có thì lấy từ results
  const fromStu=(students||[]).filter(s=>{
    const t=String(s.t||'');
    if(obj==='Bác sĩ')return /bác sĩ|bac si|^bs/i.test(t)||t===obj;
    if(obj==='Y sĩ')return /y sĩ|y si|^ys/i.test(t)||t===obj;
    if(obj==='Cử nhân PHCN')return /cử nhân|cu nhan|ktv|phcn/i.test(t)||t===obj;
    return t===obj;
  });
  if(fromStu.length)return fromStu.map(s=>({n:s.n,from:s.from||'',to:s.to||'',guide:''}));
  // fallback: unique names from results
  const seen={},out=[];
  (results||[]).filter(r=>r.t===obj&&r.type!=='wheel').forEach(r=>{
    const k=normName(r.n);if(seen[k])return;seen[k]=1;
    out.push({n:r.n,from:r.from||'',to:r.to||'',guide:''});
  });
  return out;
}
function buildEndSheet(obj){
  const d=new Date();
  const ngay='TP. Hồ Chí Minh, ngày '+String(d.getDate()).padStart(2,'0')+' tháng '+String(d.getMonth()+1).padStart(2,'0')+' năm '+d.getFullYear();
  const month=currentMonthLabel();
  const list=studentsByObj(obj);
  const isKTV=obj==='Cử nhân PHCN';
  const title=isKTV
    ?('DANH SÁCH KTV VLTL CHỨNG CHỈ HÀNH NGHỀ THI THỰC HÀNH CUỐI ĐỢT '+month)
    :obj==='Y sĩ'
      ?('DANH SÁCH Y SĨ THỰC HÀNH CHỨNG CHỈ HÀNH NGHỀ THI CUỐI ĐỢT '+month)
      :('DANH SÁCH BÁC SĨ CHỨNG CHỈ HÀNH NGHỀ THI CUỐI ĐỢT '+month);
  const rows=[];
  // Header block
  rows.push(['BỆNH VIỆN Y HỌC CỔ TRUYỀN THÀNH PHỐ HỒ CHÍ MINH','','CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM']);
  rows.push(['KHOA VLTL - PHCN','','Độc lập - Tự do - Hạnh phúc']);
  rows.push(['','',ngay]);
  rows.push([title]);
  rows.push([]);
  if(isKTV){
    rows.push(['STT','Họ và tên','Thời gian thực hành','Ký tên','Điểm thi','Người hướng dẫn']);
    list.forEach((s,i)=>{
      const sc=scoreForStudent(s.n,obj);
      rows.push([i+1,s.n,periodText(s.from,s.to),'',sc,s.guide||'']);
    });
  }else{
    rows.push(['STT','Họ và tên','Thời gian thực tập','Ký tên','','Người hướng dẫn tại khoa']);
    rows.push(['','','','Lý thuyết','Thực hành','']);
    list.forEach((s,i)=>{
      const sc=scoreForStudent(s.n,obj);
      rows.push([i+1,s.n,periodText(s.from,s.to),sc,'',s.guide||'']);
    });
  }
  rows.push([]);
  rows.push(['','','Trưởng khoa']);
  rows.push([]);
  rows.push([]);
  rows.push([]);
  rows.push(['','','Nguyễn Thị Ly Châu']);
  return {rows,title,list};
}
function aoaToWorkbook(rows,sheetName){
  const ws=XLSX.utils.aoa_to_sheet(rows);
  // column widths
  ws['!cols']=[{wch:6},{wch:28},{wch:40},{wch:14},{wch:14},{wch:22}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,sheetName||'KetQua');
  return wb;
}
function downloadWorkbook(wb,filename){
  try{
    XLSX.writeFile(wb,filename);
    return true;
  }catch(e){
    try{
      const d=XLSX.write(wb,{type:'array',bookType:'xlsx'});
      const blob=new Blob([d],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=filename;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      return true;
    }catch(e2){alert('Không tải được file: '+e2.message);return false}
  }
}
async function expEnd(obj){
  if(typeof XLSX==='undefined')return alert('Chưa tải thư viện Excel');
  const {rows,list}=buildEndSheet(obj);
  if(!list.length){
    if(!confirm('Chưa có học viên '+obj+' trong danh sách. Vẫn tạo file mẫu trống?'))return;
  }
  const d=new Date();
  const stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0');
  const short=obj==='Cử nhân PHCN'?'KTV':(obj==='Y sĩ'?'YSi':'BS');
  const filename='Ket_qua_'+short+'_cuoi_dot_'+stamp+'.xlsx';
  const wb=aoaToWorkbook(rows,'KetQua');
  downloadWorkbook(wb,filename);
  // Lưu lên Drive
  if(OK&&ADM){
    try{
      const b64=XLSX.write(wb,{type:'base64',bookType:'xlsx'});
      const r=await api({action:'saveExport'},{pin:ADM,name:filename,data:b64});
      if(r&&r.ok)toast('Đã lưu lên Drive'+(r.url?' — mở được từ thư mục kết quả thi':''));
      else toast('Đã tải về máy. Chưa lưu Drive: '+(r&&r.error||''),1);
    }catch(e){toast('Đã tải về máy. Chưa lưu Drive: '+e.message,1)}
  }else{
    toast('Đã tải file về máy'+(ADM?'':' (đăng nhập quản trị để lưu Drive)'));
  }
}


// ===== Persist view + admin session =====
const VIEW_KEY='vltl_view', ADM_KEY='vltl_adm';
function saveView(k,arg){try{localStorage.setItem(VIEW_KEY,JSON.stringify({k:k||'home',arg:arg||null,t:Date.now()}))}catch(e){}try{if(typeof pushNav==='function')pushNav(k,arg)}catch(e){}}
function restoreView(){
  try{
    const v=JSON.parse(localStorage.getItem(VIEW_KEY)||'null');
    if(!v||!v.k){home();return}
    if(v.k==='home')home();
    else if(v.k==='rules')rules();
    else if(v.k==='rooms')rooms();
    else if(v.k&&v.k.startsWith('s')&&v.k.length<=3)subj(+v.k.slice(1));
    else if(v.k==='admin'&&ADM)admin2();
    else home();
  }catch(e){home()}
}
try{const a=sessionStorage.getItem(ADM_KEY);if(a)ADM=a}catch(e){}
function setAdm(p){ADM=p;try{if(p)sessionStorage.setItem(ADM_KEY,p);else sessionStorage.removeItem(ADM_KEY)}catch(e){}}
function logoutAdm(){setAdm(null);toast('Đã thoát quản trị');try{const v=JSON.parse(localStorage.getItem(VIEW_KEY)||'null');if(v&&v.k==='rooms')rooms();else home()}catch(e){home()}}

// Patch navigation
const _home=home,_rules=rules,_rooms=rooms,_subj=subj,_admin2=typeof admin2==='function'?admin2:null;
function markAdminNav(){
  if(typeof T==='function')T('lock','Quản trị viên','Mở thi, chọn đề, danh sách học viên, kết quả','admin');
}
home=function(){saveView('home');_home.apply(this,arguments)};
rules=function(){saveView('rules');_rules.apply(this,arguments)};
rooms=function(){saveView('rooms');const y=window.scrollY;_rooms.apply(this,arguments);requestAnimationFrame(()=>window.scrollTo(0,y))};
subj=function(i){saveView('s'+i);_subj.apply(this,arguments)};
if(_admin2)admin2=function(){saveView('admin');markAdminNav();_admin2.apply(this,arguments)};

// Patch admin: bấm menu Quản trị viên → vào trang QT + đúng tiêu đề/tab
const _admin=admin;
admin=async function(){
  if(ADM){admin2();return}
  const p=await uiPromptPass('Nhập mật khẩu để vào trang Quản trị viên.','Quản trị viên');
  if(p===null||p==='')return;
  if(!OK){await uiAlert('Chưa cấu hình kết nối Google Drive (API).','Lỗi kết nối');return}
  try{
    const r=await api({action:'auth'},{pin:p});
    if(r&&r.ok){setAdm(p);toast('Đã đăng nhập quản trị');admin2()}
    else await uiAlert('Sai mật khẩu. Vui lòng thử lại.','Đăng nhập thất bại');
  }catch(e){await uiAlert('Không kết nối được máy chủ Drive.','Lỗi kết nối')}
};

// Patch boot: không gọi config lần 2 (pullCfg đã tải). Chỉ hydrate cache + refresh view.
const _boot=boot;
boot=async function(){
  try{await _boot.apply(this,arguments)}catch(e){}
  try{
    const v=JSON.parse(localStorage.getItem(VIEW_KEY)||'null');
    if(v&&v.k==='rooms'&&typeof rooms==='function'){const y=window.scrollY;rooms();requestAnimationFrame(()=>window.scrollTo(0,y))}
    else if(v&&v.k&&v.k.startsWith('s')&&typeof subj==='function')subj(+v.k.slice(1));
  }catch(e){}
};

// Inject wheelHTML vào CUỐI trang đối tượng
const _subj2=subj;
subj=function(i){
  _subj2(i);
  try{
    if(typeof wheelHTML==='function'){
      const html=wheelHTML(i);
      A.insertAdjacentHTML('beforeend', html);
    }
  }catch(e){}
};

try{loadPersistedRM()}catch(e){}
try{if(typeof hydrateStudentsFromCache==='function')hydrateStudentsFromCache()}catch(e){}
restoreView();
// Ưu tiên tải config ngay (học viên + phòng) — không chờ tree
if(typeof pullCfg==='function')pullCfg().then(()=>{try{if(typeof rerender==='function')rerender()}catch(e){}}).catch(()=>{});
boot();

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khoa VLTL – PHCN | Quản lý đào tạo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&subset=vietnamese&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/perfect-scrollbar/1.5.5/css/perfect-scrollbar.min.css">
<link rel="stylesheet" href="assets/css/theme.css?v=4">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('vltl_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
</head>
<body>
<a class="skip" href="#view">Bỏ qua điều hướng</a>

<header class="app-header" id="hd">
  <button class="icon-btn" id="btnSb" aria-label="Thu / mở thanh bên"><i class="fas fa-bars"></i></button>
  <div class="hd-brand d-lg-none"><img src="logo.png" alt="Logo bệnh viện" width="32" height="32"></div>
  <div class="hd-search">
    <i class="fas fa-search" aria-hidden="true"></i>
    <input id="q" type="search" placeholder="Tìm kỹ thuật, trang…  (phím /)" aria-label="Tìm kiếm" autocomplete="off">
    <div id="qres" class="qres" hidden></div>
  </div>
  <div class="hd-right">
    <button class="icon-btn" id="btnTheme" aria-label="Đổi giao diện Sáng / Tối"><i class="fas fa-moon"></i></button>
    <button class="icon-btn pos-rel" id="btnBell" aria-label="Thông báo"><i class="fas fa-bell"></i><span class="dot" id="bellDot" hidden></span></button>
    <div class="hd-user">
      <div class="d-none d-md-block text-right lh"><b>Quản trị viên</b><small>BS.CKI Trần Cồng Hùng</small></div>
      <button class="avatar" id="btnAdm" aria-label="Vào trang quản trị">TH</button>
    </div>
  </div>
</header>

<aside class="app-sidebar" id="sb" aria-label="Điều hướng chính">
  <div class="sb-logo">
    <img src="logo.png" alt="Logo Bệnh viện YHCT TP.HCM" width="40" height="40">
    <div class="sb-name"><b>Bệnh viện Y học cổ truyền TP.HCM</b><small>Khoa VLTL – PHCN</small></div>
  </div>
  <nav id="menu" class="sb-scroll"></nav>
</aside>
<div class="sb-mask" id="sbMask"></div>

<main class="app-main">
  <div class="page-title" id="pt"></div>
  <div id="view" tabindex="-1"></div>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
/* Báo lỗi tải script / lỗi JS ngay trên trang để dễ chẩn đoán */
addEventListener('error',function(e){var t=e.target&&e.target.src,m=t?('Không tải được: '+t):(e.message+' ('+(e.filename||'').split('/').pop()+':'+e.lineno+')');
 var b=document.getElementById('errbar')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'errbar'}));
 b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:999;background:#d92550;color:#fff;padding:8px 14px;font:13px system-ui';b.innerHTML+='<div>⚠ '+m.replace(/</g,'&lt;')+'</div>'},true);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/perfect-scrollbar/1.5.5/perfect-scrollbar.min.js"></script>
<!-- data.js: dữ liệu cũ (TECH, QS, KEYS, SUBJ, SCH…) cắt từ index.html cũ + dòng window.VLTL={...} -->
<script src="assets/js/data.js?v=4"></script>
<script src="assets/js/app.js?v=4"></script>
</body>
</html>
